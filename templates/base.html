<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语四六级刷题系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #0d6efd; }
        .navbar .navbar-brand, .navbar .nav-link { color: white; }
        .nav-tabs .nav-link { color: #0759c7; }
        .nav-tabs .nav-link.active { color: #212529; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .option-btn { width: 100%; text-align: left; margin-bottom: 8px; border-radius: 8px; }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; }
        .incorrect { background-color: #f8d7da !important; border-color: #f5c6cb !important; }
        .section-header { border-left: 5px solid #0d6efd; padding-left: 10px; margin: 20px 0; font-weight: bold; }
        body.has-audio-bar { padding-bottom: 80px; }
        #audio-bar audio { width: 100%; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="/">CET 四六级刷题</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navigation"
                    aria-controls="main-navigation" aria-expanded="false" aria-label="展开导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="main-navigation">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                    <li class="nav-item"><a class="nav-link" href="/wrong_questions">错题集</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin">后台设置</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- One player for the whole page; the "播放本组" buttons load a paper's MP3 into it and seek. -->
    <div id="audio-bar" class="fixed-bottom bg-dark text-white px-3 py-2 shadow d-none">
        <div class="container d-flex align-items-center gap-3">
            <span id="audio-bar-title" class="small text-nowrap"></span>
            <audio id="audio-player" controls preload="none" class="flex-grow-1"></audio>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    async function requestJSON(url, options = {}) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);
        try {
            const response = await fetch(url, { ...options, signal: controller.signal });
            const data = await response.json();
            if (!response.ok || data.error) throw new Error(data.error || '请求失败，请重试');
            return data;
        } catch (error) {
            if (error.name === 'AbortError') throw new Error('请求超时，请重试');
            if (error instanceof TypeError || error instanceof SyntaxError) throw new Error('连接失败，请稍后重试');
            throw error;
        } finally {
            clearTimeout(timeout);
        }
    }

    function showQuestionError(qItem, message) {
        const feedback = qItem.querySelector('.feedback');
        feedback.classList.remove('d-none');
        const alert = feedback.querySelector('.alert');
        alert.className = 'alert alert-warning py-2 mb-2';
        alert.textContent = message;
    }

    async function sendQuestionAnswer(qItem, answer) {
        if (qItem.dataset.pending === 'true' || qItem.classList.contains('answered')) return;
        qItem.dataset.pending = 'true';
        const controls = qItem.querySelectorAll('.options-container button, .options-container input, .options-container select');
        controls.forEach(control => control.disabled = true);
        try {
            const data = await requestJSON('/submit_answer', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question_id: qItem.dataset.qId, answer })
            });
            delete qItem.dataset.wasAutoShown;
            renderFeedback(qItem, answer, data);
            if (data.unanswered) qItem.classList.remove('answered');
        } catch (error) {
            qItem.classList.remove('answered');
            showQuestionError(qItem, error.message);
        } finally {
            delete qItem.dataset.pending;
            controls.forEach(control => control.disabled = false);
        }
    }

    (function () {
        const bar = document.getElementById('audio-bar');
        const player = document.getElementById('audio-player');
        const title = document.getElementById('audio-bar-title');
        const fmt = s => { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

        document.addEventListener('click', function (e) {
            const play = e.target.closest('.audio-play');
            if (play) {
                const box = play.closest('.audio-controls');
                if (player.dataset.src !== play.dataset.src) {
                    player.src = play.dataset.src;
                    player.dataset.src = play.dataset.src;
                    title.textContent = play.dataset.title;
                }
                bar.classList.remove('d-none');
                document.body.classList.add('has-audio-bar');
                const start = parseFloat(box.dataset.audioStart) || 0;
                const seek = () => {
                    if (Number.isFinite(player.duration) && start >= player.duration) {
                        box.querySelector('.audio-hint').textContent = '起点超过录音时长，请重新标记';
                        return;
                    }
                    player.currentTime = start;
                    player.play().catch(() => { box.querySelector('.audio-hint').textContent = '播放失败，请检查音频后重试'; });
                };
                if (player.readyState >= 1) seek();
                else { player.addEventListener('loadedmetadata', seek, { once: true }); player.load(); }
                return;
            }
            const mark = e.target.closest('.audio-mark');
            if (mark) {
                const box = mark.closest('.audio-controls');
                if (player.dataset.src !== box.querySelector('.audio-play').dataset.src || player.readyState < 1) {
                    alert('请先播放这组题对应的录音，再标记起点'); return;
                }
                const seconds = Math.max(0, player.currentTime - 1); // a second of lead-in
                mark.disabled = true;
                requestJSON('/set_audio_start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ group_id: box.dataset.groupId, seconds: seconds })
                }).then(() => {
                    box.dataset.audioStart = seconds;
                    box.querySelector('.audio-play').innerHTML = '▶ 播放本组 <span class="audio-start-label">(' + fmt(seconds) + ')</span>';
                    box.querySelector('.audio-hint').textContent = '起点已记为 ' + fmt(seconds);
                }).catch(error => { box.querySelector('.audio-hint').textContent = error.message; })
                  .finally(() => { mark.disabled = false; });
            }
        });
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
